<!-- Basket line: code/title/photo, current unit price/count, quantity input, line total and remove action. -->
<article class="shop-basket-line">
  <a href="#/shop/product/{{shn:0}}">{{shn:2}}</a>
  <div class="shop-line-content"><strong>{{shn:1}}</strong><span>{{shn:3}} × {{shn:4}}</span>
    <input type="number" min="1" max="{{shn:7}}" step="1" value="{{shn:6}}" data-shop-quantity="{{shn:5}}" aria-label="{{shn:1}}" {{shn:8}}>
    <span>{{shn:9}}</span>
  </div><button type="button" data-shop-remove="{{shn:10}}">{{shn:11}}</button>
</article>
